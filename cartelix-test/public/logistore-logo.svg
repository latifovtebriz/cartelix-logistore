<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep premium background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing emerald gradient -->
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bright teal gradient -->
    <linearGradient id="teal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#022c22" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Logo Icon -->
  <g transform="translate(256, 140)" filter="url(#shadow)">
    <!-- Left Face -->
    <path d="M -100 -25 L 0 30 L 0 145 L -100 90 Z" fill="url(#emerald)"/>
    <!-- Right Face -->
    <path d="M 0 30 L 100 -25 L 100 90 L 0 145 Z" fill="url(#teal)"/>
    <!-- Top Face -->
    <path d="M -100 -25 L 0 -80 L 100 -25 L 0 30 Z" fill="#ffffff" opacity="0.15"/>
    
    <!-- Forward tech arrows conveying speed/logistics -->
    <path d="M -45 15 L 15 50 L -45 85 L -25 100 L 55 50 L -25 -5 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M -5 10 L 35 35 L -5 60 L 5 70 L 55 35 L 5 -5 Z" fill="#34d399" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="256" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-1">LogiStore</text>
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="12">DIGITAL</text>
</svg>
